name: Symfony

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # A mano desde la pestana Actions: publica la imagen de master sin hacer otro push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        # El mismo PHP que la imagen (Dockerfile) y que config.platform.php de composer.json.
        php-version: '8.1'
        # soap: greenter/ws. gd: ConfigurationControllerTest genera un logo de prueba.
        extensions: soap, gd
    - uses: actions/checkout@v4
    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php81-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php81-
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Execute tests via PHPUnit
      run: php bin/phpunit

  # La imagen de produccion, publicada por commit: quien la usa la fija con
  # ghcr.io/nahumfgz/lycet-fork:<sha> en vez de construirla desde git en su servidor. Solo
  # master publica (push o a mano); en un PR o en otra rama solo se construye, para no enterarse
  # en master de que el Dockerfile se rompio.
  imagen:
    needs: symfony-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/nahumfgz/lycet-fork:latest
            ghcr.io/nahumfgz/lycet-fork:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
