jms_serializer:
    property_naming:
        id: 'jms_serializer.identical_property_naming_strategy'
    metadata:
        auto_detection: false
        directories:
            GreenterCore:
                namespace_prefix: "Greenter\\Model"
                path: "%kernel.project_dir%/config/serializer"
            # Modelos propios de este fork (hoy: la guia del transportista). Va en su propio
            # directorio porque el de arriba esta atado al prefijo Greenter\Model.
            AppModel:
                namespace_prefix: "App\\Model"
                path: "%kernel.project_dir%/config/serializer-app"
    visitors:
        json_serialization:
            options:
                - JSON_PRETTY_PRINT
                - JSON_UNESCAPED_SLASHES
                - JSON_PRESERVE_ZERO_FRACTION

when@prod:
    jms_serializer:
        visitors:
            json_serialization:
                options:
                    - JSON_UNESCAPED_SLASHES
                    - JSON_PRESERVE_ZERO_FRACTION

